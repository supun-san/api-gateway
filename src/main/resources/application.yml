server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    consul:
      host: consul
      port: 8500

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8085/realms/micro-services
